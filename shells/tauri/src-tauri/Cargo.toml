[package]
name = "gako-tauri"
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
getrandom = "0.4"
serde_json = "1"

[features]
default = ["custom-protocol"]
# Serve the built frontend from the binary instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 4

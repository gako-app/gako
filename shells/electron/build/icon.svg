<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gako's icon: the terminal prompt where agents run, followed by one line per agent in its
       state's colour: working (green), waiting for you (amber), done (blue). Drawn on macOS's icon
       grid: an 824 px rounded square with a 100 px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g filter="url(#lift)">
    <path d="M262,300 L484,512 L262,724" fill="none" stroke="#ffffff" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="600" y="296" width="226" height="96" rx="48" fill="#22c55e"/>
    <rect x="600" y="464" width="160" height="96" rx="48" fill="#fbbf24"/>
    <rect x="600" y="632" width="200" height="96" rx="48" fill="#38bdf8"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gako's icon (draft): repositories as rows, each with its state. Drawn on macOS's icon grid:
       an 824 px rounded square with a 100 px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="row" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g filter="url(#row)">
    <rect x="232" y="280" width="560" height="120" rx="36" fill="#ffffff"/>
    <rect x="232" y="452" width="560" height="120" rx="36" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="232" y="624" width="560" height="120" rx="36" fill="#ffffff" fill-opacity="0.84"/>
  </g>
  <circle cx="302" cy="340" r="28" fill="#22c55e"/>
  <circle cx="302" cy="512" r="28" fill="#f59e0b"/>
  <circle cx="302" cy="684" r="28" fill="#3b82f6"/>
  <rect x="360" y="326" width="320" height="28" rx="14" fill="#c7d2fe"/>
  <rect x="360" y="498" width="380" height="28" rx="14" fill="#c7d2fe"/>
  <rect x="360" y="670" width="260" height="28" rx="14" fill="#c7d2fe"/>
</svg>

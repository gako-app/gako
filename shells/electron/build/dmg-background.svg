<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- The disk image's window: Gako's icon at (170, 150) and the Applications link at (470, 150),
       placed by scripts/dmg-settings.py, with an arrow between them. Light on purpose: Finder draws
       the icons' labels in black over a background picture, in dark mode too. One flat colour, so
       that a window a few points taller than the picture, where the title bar is shorter, doesn't
       show where it ends. -->
  <defs>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="266" y1="0" x2="376" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#f6f7fa"/>

  <!-- The arrow, from Gako to Applications. -->
  <g fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266,150 H368" stroke-dasharray="0.1 13"/>
    <path d="M364,138 L376,150 L364,162"/>
  </g>

  <line x1="64" y1="282" x2="576" y2="282" stroke="#dde2ec" stroke-width="1"/>
  <text text-anchor="middle" fill="#6b7280"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12">
    <tspan x="320" y="310">If macOS says it can’t verify Gako when you first open it,</tspan>
    <tspan x="320" y="328">go to System Settings › Privacy &amp; Security and click Open Anyway.</tspan>
  </text>
</svg>
